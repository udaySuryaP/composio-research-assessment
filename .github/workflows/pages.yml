name: Publish case study
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-stage02.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m agent.stage02 verify-freeze --run-id stage02-full-fallback-20260916
      - run: python -B -m agent.stage03_finalize check
      - run: python -B -m agent.stage03 check
      - run: python -B final_build.py
      - run: python -B -m agent.release publish "${{ runner.temp }}/assessment-pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/assessment-pages
      - id: deployment
        uses: actions/deploy-pages@v4
