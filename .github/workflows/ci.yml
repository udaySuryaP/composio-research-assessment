name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Offline verification
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-stage02.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-stage02.txt

      - name: Run tests
        run: python -B -m unittest discover -s tests -v

      - name: Rebuild from saved inputs
        run: python -B final_build.py

      - name: Validate release artifacts
        run: python -B -m agent.release check
